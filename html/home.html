<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

background:
linear-gradient(135deg,#ff416c,#ff4b2b,#ff9a9e);

display:flex;

justify-content:center;

align-items:center;

font-family:'Poppins',sans-serif;

color:white;

}



/* Stars */

.star{

position:absolute;

width:5px;

height:5px;

background:white;

border-radius:50%;

animation:blink 2s infinite;

}


@keyframes blink{

50%{
opacity:.2;
}

}



/* Main Card */

.card{

width:90%;

max-width:900px;

padding:50px;

text-align:center;

background:rgba(255,255,255,.15);

backdrop-filter:blur(15px);

border-radius:30px;

box-shadow:0 20px 60px rgba(0,0,0,.3);

animation:appear 2s;

}



@keyframes appear{

from{

opacity:0;

transform:scale(.5);

}

to{

opacity:1;

transform:scale(1);

}

}




h1{

font-family:'Great Vibes',cursive;

font-size:80px;

text-shadow:0 0 20px white;

}



.cake{

font-size:100px;

animation:bounce 2s infinite;

}



@keyframes bounce{

50%{

transform:translateY(-20px);

}

}




.message{

margin-top:25px;

font-family:'Dancing Script',cursive;

font-size:35px;

line-height:1.5;

}



button{

margin-top:40px;

padding:15px 40px;

border:none;

border-radius:50px;

background:white;

color:#ff416c;

font-size:20px;

cursor:pointer;

font-weight:bold;

transition:.3s;

}



button:hover{

transform:scale(1.1);

}



</style>

</head>


<body>


<div id="stars"></div>



<div class="card">


<div class="cake">
🎂
</div>



<h1>
Happy Birthday My Love ❤️
</h1>


<div class="message">


Today is not just another day...

It is the day the world got someone as special as you.

Thank you for bringing happiness,
love and countless smiles into my life.

You are my favorite person,
my biggest blessing,
and my forever.

❤️ I Love You ❤️


</div>



<button onclick="goNext()">

Open My Heart 💌

</button>


</div>





<script>


// stars background

for(let i=0;i<80;i++){

let star=document.createElement("div");

star.className="star";

star.style.left=Math.random()*100+"vw";

star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*2+"s";

document.body.appendChild(star);

}



// Go to love letter

function goNext(){

window.location.href="home2.html";

}


</script>


</body>

</html>

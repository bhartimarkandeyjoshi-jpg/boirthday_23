<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Only For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(135deg,#ff758c,#ff7eb3,#ffd1dc);

    font-family:'Poppins',sans-serif;
}


/* Floating hearts */

.heart{
    position:absolute;
    bottom:-50px;
    color:white;
    animation:rise 8s linear infinite;
}

@keyframes rise{

0%{
    transform:translateY(0) rotate(0);
    opacity:1;
}

100%{
    transform:translateY(-120vh) rotate(360deg);
    opacity:0;
}

}


/* Lock Box */

.container{

background:rgba(255,255,255,0.2);
backdrop-filter:blur(15px);

width:350px;

padding:40px;

border-radius:25px;

text-align:center;

box-shadow:
0 20px 50px rgba(0,0,0,.2);

color:white;

}


.lock{

font-size:80px;

animation:pulse 2s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.1);
}

}


h1{

font-family:'Great Vibes',cursive;

font-size:55px;

margin:20px 0;

}


p{

font-size:16px;

}


input{

margin-top:25px;

width:100%;

padding:15px;

border:none;

border-radius:30px;

text-align:center;

font-size:20px;

outline:none;

}


button{

margin-top:20px;

width:100%;

padding:15px;

border:none;

border-radius:30px;

background:#ff1744;

color:white;

font-size:18px;

cursor:pointer;

transition:.3s;

}


button:hover{

background:#d50000;

transform:scale(1.05);

}


#error{

margin-top:15px;

color:#fff;

}


</style>

</head>


<body>


<div id="hearts"></div>


<div class="container">

<div class="lock">
🔒❤️
</div>


<h1>
My Love
</h1>


<p>
This little world is only for you...
</p>


<p>
Enter our secret date ❤️
</p>


<input 
type="password"
id="code"
placeholder="******">


<button onclick="unlock()">

Unlock My Heart 💕

</button>


<div id="error"></div>


</div>



<script>


// Create floating hearts

for(let i=0;i<50;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";


heart.style.left=Math.random()*100+"vw";


heart.style.animationDuration=
(5+Math.random()*5)+"s";


heart.style.fontSize=
(15+Math.random()*30)+"px";


document.body.appendChild(heart);

}



// Password function

function unlock(){


let password="231008";


let entered=
document.getElementById("code").value;


if(entered===password){


window.location.href="home.html";


}

else{


document.getElementById("error").innerHTML=
"Wrong code ❤️ Try again";


}


}


</script>


</body>
</html>

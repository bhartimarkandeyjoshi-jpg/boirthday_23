<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Love ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fecfef,#fad0c4);
    overflow:hidden;
    font-family:'Poppins',sans-serif;
}

.container{
    text-align:center;
    z-index:100;
    padding:30px;
}

h1{
    font-family:'Great Vibes',cursive;
    font-size:80px;
    color:white;
    text-shadow:0 0 15px rgba(255,255,255,.8);
    margin-bottom:20px;
}

p{
    color:white;
    font-size:24px;
    max-width:700px;
    margin:auto;
    line-height:1.8;
    margin-bottom:45px;
}

button{
    padding:18px 45px;
    font-size:24px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    background:#ff2d75;
    color:white;
    font-weight:bold;
    transition:.4s;
    box-shadow:0 10px 25px rgba(255,45,117,.45);
}

button:hover{
    transform:scale(1.08);
    background:#ff0066;
    box-shadow:0 15px 35px rgba(255,45,117,.7);
}

.heart{
    position:absolute;
    top:-50px;
    animation:fall linear infinite;
    pointer-events:none;
}

@keyframes fall{

0%{
    transform:translateY(-50px) rotate(0deg);
    opacity:1;
}

100%{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
}

}

</style>

</head>

<body>

<div class="container">

<h1>Just One More Surprise ❤️</h1>

<p>
Every little moment with you feels magical. Before you continue, I have something special waiting for you. I hope this little surprise brings a smile to your face, just like you bring one to mine every single day. 💕
</p>

<button onclick="nextPage()">
💖 Press it, Babyy 💖
</button>

</div>

<script>

for(let i=0;i<60;i++){

let heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(18+Math.random()*28)+"px";

heart.style.animationDuration=(5+Math.random()*6)+"s";

heart.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(heart);

}

function nextPage(){

window.location.href="home3.html";

}

</script>

</body>
</html>
